# Sei volte al giorno legge i post della pagina Facebook del comitato e li trasforma in notizie.
# Se ci sono novità le carica su GitHub, e Cloudflare aggiorna il sito da solo.
# Legge la pagina con Apify (segreto APIFY_TOKEN) oppure, se un giorno ci sarà, con le API di Meta (FB_PAGE_TOKEN).
# Si può anche avviare a mano da GitHub: scheda Actions → Notizie da Facebook → Run workflow.
# Con la casella «Rifai le foto» non legge i post: riscarica tutte le foto delle notizie già pubblicate.
# Con i campi «Archivio» importa una volta sola i post vecchi da dataset di Apify già letti e carica le notizie
# sul ramo «archivio-notizie», non sul sito: titoli e sommari si sistemano prima di pubblicarle.
# Le foto vanno nello spazio R2 di Cloudflare (segreti R2_ENDPOINT, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY).
name: Notizie da Facebook

on:
  schedule:
    # alle 7:29, 10:29, 13:29, 16:29, 19:29 e 22:29 ora italiana (in inverno; d'estate un'ora dopo).
    # Dal 29 ottobre GitHub non aveva mai avviato l'automazione da sola: il 5 novembre 2026 QN-Builder ha spostato
    # l'orario da :23 a :29 (scelta di Riccardo), perché secondo GitHub chi ha i permessi di scrittura riattiva
    # un orario cambiandolo.
    - cron: '29 6-21/3 * * *'
  workflow_dispatch:
    inputs:
      rifai_foto:
        description: 'Rifai le foto: riscarica tutte le foto delle notizie già pubblicate'
        type: boolean
        default: false
      archivio_dal:
        description: 'Archivio: importa i post vecchi da questo giorno (AAAA-MM-GG) fino all''inizio delle notizie'
        type: string
        default: ''
      archivio_dataset:
        description: 'Archivio: i dataset di Apify con i post già letti, separati da virgole'
        type: string
        default: ''

permissions:
  contents: write
  issues: write

concurrency:
  group: notizie-facebook
  cancel-in-progress: false

jobs:
  importa:
    runs-on: ubuntu-latest
    # l'archivio scarica le foto di centinaia di post: può durare ore
    timeout-minutes: ${{ inputs.archivio_dal && 300 || 20 }}
    env:
      FB_ARCHIVIO_DAL: ${{ inputs.archivio_dal }}
      FB_ARCHIVIO_DATASET: ${{ inputs.archivio_dataset }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/facebook/package-lock.json

      - name: Installa gli strumenti
        working-directory: scripts/facebook
        run: npm ci

      - name: Leggi i post e prepara le notizie
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          FB_RIFAI_FOTO: ${{ inputs.rifai_foto && '1' || '' }}
        run: node scripts/facebook/importa.mjs

      - name: Carica le novità
        run: |
          git add -A src/content/news scripts/facebook/stato.json
          # Le foto stanno su R2: la cartella public/news c'è solo se R2 non ha risposto, e git si ferma
          # se gli si chiede di aggiungere una cartella che non esiste (così la corsa del 5 novembre alle 19:41)
          if [ -d public/news ] || [ -n "$(git ls-files public/news)" ]; then
            git add -A public/news
          fi
          if git diff --cached --quiet; then
            echo "Nessuna novità da caricare."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "$(cat "$RUNNER_TEMP/messaggio-facebook.txt")"
          if [ -n "$FB_ARCHIVIO_DAL" ]; then
            # l'archivio va su un ramo a parte: sul sito arriva dopo, con titoli e sommari sistemati
            git push origin HEAD:refs/heads/archivio-notizie
            exit 0
          fi
          # se nel frattempo è arrivata una modifica al sito, ci si mette in coda invece di fallire
          git pull --rebase origin main
          git push

      - name: Avvisa se Facebook non risponde
        # non per l'archivio, che si avvia a mano e si controlla a mano
        if: failure() && !inputs.archivio_dal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          titolo="Il sito non riesce a leggere la pagina Facebook"
          if [ -z "$(gh issue list --state open --search "in:title \"$titolo\"" --json number --jq '.[].number')" ]; then
            gh issue create --title "$titolo" --body "L'automazione che trasforma i post di Facebook in notizie si è fermata. Di solito succede quando il codice di accesso (token) di Apify o di Facebook non è più valido, o quando su Apify è finito il credito.

          Cosa fare: apri una chat con Claude e scrivi «le notizie da Facebook si sono fermate».

          Dettagli tecnici: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
