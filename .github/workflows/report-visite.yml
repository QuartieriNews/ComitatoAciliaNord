# Report mensile delle visite al sito, spedito per email a info@comitatoacilianord.it.
# I numeri vengono da Cloudflare Web Analytics (senza cookie, scritto nella pagina Privacy).
# Segreti da salvare su GitHub (li salva Riccardo, non si incollano mai in chat):
#   CF_API_TOKEN   codice di Cloudflare con i permessi «Account Analytics: Read» e «Account Settings: Read»
#   SMTP_USER      la casella Aruba che spedisce, indirizzo completo
#   SMTP_PASSWORD  la sua password
name: Report mensile delle visite

on:
  schedule:
    # il 1°, il 2 e il 3 del mese alle 8:17 ora italiana (in inverno; d'estate alle 9:17): GitHub a volte salta
    # o ritarda gli orari, quindi si riprova nei due giorni dopo, ma il report parte una volta sola al mese
    - cron: '17 7 1-3 * *'
  workflow_dispatch:
    inputs:
      mese:
        description: 'Mese da raccontare, AAAA-MM (vuoto = il mese appena finito)'
        type: string
        default: ''

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: report-visite
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Controlla se il report di questo mese è già partito
        id: gia
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fatte=$(gh run list -R "$GITHUB_REPOSITORY" --workflow report-visite.yml --event schedule --status success \
            --created ">=$(date -u +%Y-%m-01)" --json databaseId --jq 'length')
          echo "spedito=$([ "$fatte" -gt 0 ] && echo si || echo no)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gia.outputs.spedito != 'si'

      - name: Prepara e spedisce il report
        if: steps.gia.outputs.spedito != 'si'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_MESE: ${{ inputs.mese }}
        run: python3 scripts/statistiche/report.py

      - name: Avvisa se il report non è partito
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          titolo="Il report mensile delle visite non è partito"
          if [ -z "$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$titolo\"" --json number --jq '.[].number')" ]; then
            gh issue create -R "$GITHUB_REPOSITORY" --title "$titolo" --body "Il report del primo del mese con le visite al sito non è arrivato a info@. Di solito succede quando il codice di Cloudflare (CF_API_TOKEN) o la password della casella che spedisce (SMTP_PASSWORD) non sono più validi.

          Cosa fare: apri una chat con Claude e scrivi «il report delle visite non è arrivato».

          Dettagli tecnici: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
